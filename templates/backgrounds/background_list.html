<h1 class="info-link" data-name="Custom Backgrounds" data-text='<div class="container-fluid fw-light"><p>In the event that a background you like doesn&#39;t have the right mix of proficiencies for what you want, you can customize your background by swapping like for like: background feats for feats that do not have level prerequisites, skill proficiencies can be swapped for other skill proficiencies, and tool or language proficiencies can be swapped for other tool or language proficiencies. You can swap a tool for a language, or a language for a tool, but not a language/tool for a skill. This supercedes the rule in the PHB.</p><p>You cannot swap a feature while customizing your background, nor can you use customization / another background to approximate the lore or features of another background.</p></div>'>Backgrounds</h1>


<filterable-table table-id="background-table" button-text="New Background" key="background" data-source='{{table|tojson|e}}'></filterable-table>
