<custom-modal title="Background" custom-id="background-edit-form" {% if background %}data-id="{{ background.id }}" data-parent="{{ background.parent }}" {% endif %}>
    <div class="container">
        <div class="row mb-2">
            <div class="col-6 mb-2">
                <text-input 
                custom-id="background-name" 
                label-text="Background Name" 
                value="{{background.name if background else ''}}">
                </text-input>
            </div>
            <div class="col-6 mb-2">
                <select-input custom-id="background-source" custom-label="Content Source" options='{{ options['content-source']|tojson }}' selected="{{ background.source.id if background and background.source else '6' }}"></select-input>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-6 mb-3">
                <text-input
                custom-id="background-skills"
                label-text="Skill Proficiencies",
                value="{{background.skills if background else ''}}">
                </text-input>
            </div>
            <div class="col-6 mb-3">
                <text-input
                custom-id="background-tools"
                label-text="Tool Proficiencies",
                value="{{background.tools if background else ''}}">
                </text-input>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-6 mb-3">
                <text-input
                custom-id="background-languages"
                label-text="Languages",
                value="{{background.languages if background else ''}}">
                </text-input>
            </div>
            <div class="col-6 mb-3">
                <text-input
                custom-id="background-equipment"
                label-text="Equipment",
                value="{{background.equipment if background else ''}}">
                </text-input>
            </div>
        </div>
        <div class="row mb-2">
            <label for="background-flavortext" class="form-label fw-bold">Flavortext</label>
            <textarea id="background-flavortext" value="" spellcheck="true" class="form-control">{{ background.flavortext if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <div class="col-12 mb-3">
                <text-input
                custom-id="background-flavor-name"
                label-text="Flavor Name",
                value="{{background.flavor_name if background else ''}}">
                </text-input>
            </div>
        </div>
        <div class="row mb-2">
            <label for="background-flavor-description" class="form-label fw-bold">Flavor Description</label>
            <textarea id="background-flavor-description" value="" spellcheck="true" class="form-control">{{ background.flavor_description if background else ''}}</textarea>
        </div>
         <div class="row mb-2">
            <div class="col-12 mb-3">
                <text-input
                custom-id="background-feature-name"
                label-text="Feature Name",
                value="{{background.feature_name if background else ''}}">
                </text-input>
            </div>
        </div>
        <div class="row mb-2">
            <label for="background-feature-text" class="form-label fw-bold">Feature Text</label>
            <textarea id="background-feature-text" value="" spellcheck="true" class="form-control">{{ background.feature_text if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <label for="background-feats" class="form-label fw-bold">Features</label>
            <textarea id="background-feats" value="" spellcheck="true" class="form-control">{{ background.feats if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <label for="background-suggested-characteristics" class="form-label fw-bold">Suggested Characteristics</label>
            <textarea id="background-suggested-characteristics" value="" spellcheck="true" class="form-control">{{ background.suggested_characteristics if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <label for="background-personality" class="form-label fw-bold">Personality</label>
            <textarea id="background-personality" value="" spellcheck="true" class="form-control">{{ background.personality if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <label for="background-ideal" class="form-label fw-bold">Ideal</label>
            <textarea id="background-ideal" value="" spellcheck="true" class="form-control">{{ background.ideal if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <label for="background-flaw" class="form-label fw-bold">Flaw</label>
            <textarea id="background-flaw" value="" spellcheck="true" class="form-control">{{ background.flaw if background else ''}}</textarea>
        </div>
        <div class="row mb-2">
            <label for="background-bond" class="form-label fw-bold">Bond</label>
            <textarea id="background-bond" value="" spellcheck="true" class="form-control">{{ background.bond if background else ''}}</textarea>
        </div>                
        <div class="row mb-2">
            <div class="col mb-3">
                <button type="button" class="btn btn-primary float-end m-3" id="background-submit" data-bs-dismiss="modal">
                    Submit
                </button>
                <button type="button" class="btn btn-danger float-end m-3" id="background-delete" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#delete-confirm-modal">
                    Delete
                </button>
            </div>
        </div>
    </div>
</custom-modal>

<custom-modal title="Confirm Delete" custom-id="delete-confirm-modal">
    <div class="container">
        <div class="row mb-2">
            Are you sure you want to delete this background?
        </div>
        <div class="row-mb-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-id="" id="background-delete-confirmed">Delete</button>
        </div>
    </div>
</custom-modal>
