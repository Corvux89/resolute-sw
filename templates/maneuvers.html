{% extends "template.html" %} {% block body %}

{% if is_admin %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
{% endif %}

<h1>Maneuvers</h1>

<filterable-table table-id="maneuver-table" button-text="New Maneuver" key="maneuver" data-source='{{table|tojson|e}}'></filterable-table>

{% if is_admin %}
<custom-modal title="Maneuver" custom-id="maneuver-edit-form" data-subcategory='{{ options['maneuver-type']|tojson }}'>
    <div class="container">
        <div class="row mb-2">
            <div class="col-6 mb-2">
                <text-input label-text="Name" custom-id="maneuver-name" required></text-input>
            </div>
            <div class="col-6 mb-2">
                <select-input 
                custom-id="maneuver-type" 
                custom-label="Type" 
                options='{{ options['maneuver-type']|tojson }}'
                allownone></select-input>
            </div>
        </div>
        <div class="row mb-2">
            <div class="col-6 mb-2">
                <select-input custom-id="maneuver-source" custom-label="Content Source" options='{{ options['content-source']|tojson }}'></select-input>
            </div>
            <div class="col-6 mb-2">
                <text-input 
                custom-id="maneuver-prerequisite" 
                label-text="Prerequisite"></text-input>
            </div>
        </div>
        <div class="row mb-2">
            <label for="maneuver-description" class="form-label fw-bold">Description</label>
            <textarea id="maneuver-description" value="" spellcheck="true" class="form-control big-edit-body"></textarea>
        </div>
        <div class="row mb-2">
            <div class="col mb-3">
                <button type="button" class="btn btn-primary float-end m-3" id="maneuver-submit" data-bs-dismiss="modal">
                    Submit
                </button>
                <button type="button" class="btn btn-danger float-end m-3" id="maneuver-delete" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#delete-confirm-modal">
                    Delete
                </button>
            </div>
        </div>
    </div>
</custom-modal>

<custom-modal title="Confirm Delete" custom-id="delete-confirm-modal">
    <div class="container">
        <div class="row mb-2">
            Are you sure you want to delete this piece of maneuver??
        </div>
        <div class="row-mb-2">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal" data-id="" id="maneuver-delete-confirmed">Delete</button>
        </div>
    </div>
</custom-modal>
{% endif %}

{% endblock %}
